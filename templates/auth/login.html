<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduCore CRM</title>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <style>
        .login-page-container {
            display: flex;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1b4b 0%, #3730A3 100%);
            position: relative;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }

        /* Decorative background elements */
        .bg-shape-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, rgba(99, 102, 241, 0) 70%);
            animation: pulse 10s infinite alternate;
        }

        .bg-shape-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, rgba(16, 185, 129, 0) 70%);
            animation: pulse 15s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(5%, -5%); }
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 20px;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUpFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFadeIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-logo {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .login-header h2 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-floating {
            position: relative;
            margin-bottom: 25px;
        }

        .form-floating .form-control {
            height: 55px;
            padding: 20px 15px 10px 45px;
            border: 1px solid #E5E7EB;
            border-radius: 10px;
            background-color: #F9FAFB;
        }

        .form-floating label {
            position: absolute;
            top: 50%;
            left: 45px;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .form-floating .input-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: color 0.2s ease;
        }

        .form-floating .form-control:focus ~ label,
        .form-floating .form-control:not(:placeholder-shown) ~ label {
            top: 15px;
            font-size: 0.75rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .form-floating .form-control:focus ~ .input-icon {
            color: var(--primary-color);
        }

        .btn-login-submit {
            width: 100%;
            height: 50px;
            border-radius: 10px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login-submit:hover {
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
            transform: translateY(-2px);
        }

        .error-banner {
            background-color: rgba(239, 68, 68, 0.1);
            color: #DC2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: fadeIn 0.3s ease;
        }

    </style>
</head>
<body>
    <div class="login-page-container">
        <div class="bg-shape-1"></div>
        <div class="bg-shape-2"></div>
        
        <div class="login-card">
            <div class="login-header">
                <i class="ph ph-graduation-cap login-logo"></i>
                <h2>Welcome Back</h2>
                <p>Sign in to EduCore CRM to continue</p>
            </div>
            
            {% if form.errors %}
                <div class="error-banner">
                    <i class="ph ph-warning-circle" style="font-size: 1.2rem;"></i>
                    Invalid username or password.
                </div>
            {% endif %}
            
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="form-floating">
                    <input type="text" id="username" name="username" class="form-control" placeholder=" " required autofocus>
                    <i class="ph ph-user input-icon"></i>
                    <label for="username">Username</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" id="password" name="password" class="form-control" placeholder=" " required>
                    <i class="ph ph-lock-key input-icon"></i>
                    <label for="password">Password</label>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 0.9rem;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted);">
                        <input type="checkbox" style="accent-color: var(--primary-color);">
                        Remember me
                    </label>
                    <a href="#" style="font-weight: 500;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-login-submit">
                    Sign In <i class="ph ph-arrow-right"></i>
                </button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>
        </div>
    </div>
</body>
</html>
