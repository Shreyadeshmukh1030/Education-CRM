{% extends 'base/base.html' %}
{% block title %}Create Assignment | EduCore CRM{% endblock %}
{% block page_title %}Create Assignment{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr; gap: 20px;">
            <div class="form-group">
                <label class="form-label" for="id_title">Title</label>
                <input type="text" name="title" id="id_title" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_description">Description</label>
                <textarea name="description" id="id_description" class="form-control" rows="4" required></textarea>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label class="form-label" for="id_subject">Subject</label>
                    {{ form.subject }}
                </div>
                <div class="form-group">
                    <label class="form-label" for="id_class_assigned">Class Assigned</label>
                    {{ form.class_assigned }}
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label class="form-label" for="id_due_date">Due Date & Time</label>
                    <input type="datetime-local" name="due_date" id="id_due_date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="id_max_marks">Max Marks</label>
                    <input type="number" name="max_marks" id="id_max_marks" class="form-control" value="100" required step="0.01">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_attachment">Attachment (Optional)</label>
                <input type="file" name="attachment" id="id_attachment" class="form-control">
            </div>
        </div>

        <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 10px;">
            <a href="{% url 'assignment_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="ph ph-plus" style="margin-right: 8px;"></i> Create Assignment</button>
        </div>
    </form>
</div>

<script>
    // Quick script to add form-control class to django rendered selects
    document.addEventListener('DOMContentLoaded', function() {
        const selects = document.querySelectorAll('select');
        selects.forEach(select => {
            select.classList.add('form-control');
        });
    });
</script>
{% endblock %}
