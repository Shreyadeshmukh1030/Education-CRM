{% extends 'base/base.html' %}
{% block title %}Upload Material | EduCore CRM{% endblock %}
{% block page_title %}Upload Study Material{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr; gap: 20px;">
            <div class="form-group">
                <label class="form-label" for="id_title">Title</label>
                <input type="text" name="title" id="id_title" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_description">Description</label>
                <textarea name="description" id="id_description" class="form-control" rows="4"></textarea>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label class="form-label" for="id_subject">Subject</label>
                    {{ form.subject }}
                </div>
                <div class="form-group">
                    <label class="form-label" for="id_class_assigned">Class Assigned</label>
                    {{ form.class_assigned }}
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_topic">Syllabus Topic (Optional)</label>
                {{ form.topic }}
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_file">Attachment / File</label>
                <input type="file" name="file" id="id_file" class="form-control" required>
            </div>
        </div>

        <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 10px;">
            <a href="{% url 'material_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="ph ph-upload" style="margin-right: 8px;"></i> Upload Material</button>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const selects = document.querySelectorAll('select');
        selects.forEach(select => {
            select.classList.add('form-control');
        });
    });
</script>
{% endblock %}
